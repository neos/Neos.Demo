##
# A "BlogPostingList" content element that renders blog posts teasers of the selected blogs.
#
'Neos.Demo:Content.BlogPostingList':
  superTypes:
    'Neos.Neos:Content': true
    'Neos.Demo:Constraint.Content.Main': true
  ui:
    label: i18n
    icon: 'newspaper'
    position: 100
    inlineEditable: false
    group: special
    help:
      message: |
        List of BlogPosting that allows to specify the blogs and the number of
        articles to display.
    inspector:
      groups:
        'blog':
          label: i18n
          icon: 'newspaper'
          position: 50
  references:
    blogs:
      ui:
        label: i18n
        showInCreationDialog: true
        reloadIfChanged: true
        inspector:
          group: 'blog'
          editorOptions:
            nodeTypes: ['Neos.Demo:Document.Blog']
  properties:
    limit:
      type: integer
      defaultValue: 5
      ui:
        label: i18n
        showInCreationDialog: true
        reloadIfChanged: true
        inspector:
          group: 'blog'
